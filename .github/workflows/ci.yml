name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # pyproject declares >=3.11, so both ends of that claim are tested.
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (core + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        # The suite trains real (small) models on a synthetic dataset and records them
        # in a throwaway MLflow store, so it exercises the pipeline end to end. It never
        # touches the Kaggle source — CI has no credentials and needs none.
        run: pytest
