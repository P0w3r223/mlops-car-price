[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlops-car-price"
version = "0.1.0"
description = "MLOps layer over the used-car price model: MLflow tracking and registry, drift monitoring, champion/challenger retraining"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    # The modelling layer is not reimplemented here — it is consumed from project A3,
    # pinned to a tag so a run is reproducible against a fixed modelling version.
    "car-price-ml @ git+https://github.com/P0w3r223/car-price-ml@v0.1.1",
    # The promotion gate needs a *paired* bootstrap: champion and challenger score the same
    # holdout rows. Added upstream in ab-lab 0.2.0 rather than reimplemented here.
    "ab-lab @ git+https://github.com/P0w3r223/ab-lab@v0.2.0",
    "mlflow>=2.16,<3",
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "pyarrow>=16,<21",
    # Statistical primitives for the drift metrics (KS, Wasserstein, chi-square). The
    # decision logic and PSI are implemented here; well-tested numerics are not rewritten.
    "scipy>=1.11,<2",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.6,<1",
]
# Not a runtime or CI dependency: Evidently exists here only to referee the drift metrics
# when they change (see ADR 0005 and tests/test_drift_oracle.py).
oracle = [
    "evidently>=0.7,<0.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # MLflow ships Pydantic models written against an older API — third-party, cosmetic.
    "ignore::pydantic.warnings.PydanticDeprecatedSince20",
    "ignore::pydantic.warnings.PydanticDeprecatedSince212",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
